backend:
  name: turbo-github
  turbo_site_id: ba1043dc-ce18-4c26-ae42-63f5c7b2876b
  branch: main

site_url: https://dein-yoga.at
display_url: https://dein-yoga.at
locale: de

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "willkommen"
    label: "Willkommen"
    files:
      - name: "willkommen"
        label: "Willkommen – Startbereich"
        file: "_data/willkommen.yml"
        fields:
          - { label: "Hero-Überschrift", name: "hero_title", widget: "string" }
          - { label: "Hero-Untertitel", name: "hero_subtitle", widget: "text" }
          - { label: "Hero-Bild", name: "hero_image", widget: "image" }
          - { label: "Überschrift", name: "intro_title", widget: "string" }
          - { label: "Unterüberschrift", name: "intro_subtitle", widget: "string" }
          - label: "Textabsätze"
            name: "intro_paragraphs"
            widget: "list"
            field: { label: "Absatz", name: "paragraph", widget: "text" }
          - { label: "Abschlusssatz", name: "intro_closing", widget: "string" }
          - { label: "Bild", name: "intro_image", widget: "image" }

  - name: "saison"
    label: "Saison"
    files:
      - name: "saison"
        label: "Saison – Winter.Journey"
        file: "_data/saison.yml"
        fields:
          - { label: "Saison anzeigen", name: "journey_visible", widget: "boolean", default: true }
          - { label: "Titel", name: "journey_title", widget: "string" }
          - { label: "Zeitraum", name: "journey_period", widget: "string" }
          - { label: "Einleitung", name: "journey_intro", widget: "text" }
          - label: "Beschreibungstexte"
            name: "journey_description"
            widget: "list"
            field: { label: "Absatz", name: "paragraph", widget: "text" }
          - { label: "Early-Bird-Text", name: "early_bird_text", widget: "string" }
          - { label: "Early-Bird-Stichtag", name: "early_bird_deadline", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
          - { label: "Bild", name: "journey_image", widget: "image" }
          - { label: "Button-Beschriftung", name: "journey_button_text", widget: "string" }
          - { label: "Button-Link", name: "journey_button_link", widget: "string" }

  - name: "ort"
    label: "Ort"
    files:
      - name: "ort"
        label: "Ort – Dein Platz zum Ankommen"
        file: "_data/ort.yml"
        fields:
          - { label: "Überschrift", name: "location_title", widget: "string" }
          - { label: "Unterüberschrift", name: "location_subtitle", widget: "string" }
          - label: "Textabsätze"
            name: "location_paragraphs"
            widget: "list"
            field: { label: "Absatz", name: "paragraph", widget: "text" }
          - label: "Bilderkarussell (genau 4 Bilder)"
            name: "location_images"
            widget: "list"
            min: 4
            max: 4
            fields:
              - { label: "Bild", name: "image", widget: "image" }
              - { label: "Alternativtext", name: "alt", widget: "string" }
          - { label: "Anmeldebutton", name: "location_button_text", widget: "string" }
          - { label: "Route-Button", name: "route_button_text", widget: "string" }
          - { label: "Routen-Link", name: "route_link", widget: "string" }

  - name: "geschenk"
    label: "Geschenk"
    files:
      - name: "geschenk"
        label: "Geschenk – Abschlussbereich"
        file: "_data/geschenk.yml"
        fields:
          - { label: "Überschrift", name: "cta_title", widget: "string" }
          - { label: "Textzeile 1", name: "cta_line_one", widget: "string" }
          - { label: "Textzeile 2", name: "cta_line_two", widget: "text" }
          - { label: "Button-Beschriftung", name: "cta_button_text", widget: "string" }

  - name: "kurse"
    label: "Kurse"
    files:
      - name: "kurse"
        label: "Kursangebote verwalten"
        file: "_data/kurse.yml"
        fields:
          - label: "Kursangebote"
            name: "kurse"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Kurstitel", name: "titel", widget: "string" }
              - { label: "Aktiv anzeigen", name: "aktiv", widget: "boolean", default: true }
              - { label: "Beschreibung", name: "beschreibung", widget: "text" }
              - { label: "Wochentage", name: "wochentage", widget: "string", required: false }
              - { label: "Uhrzeit", name: "uhrzeit", widget: "string", required: false }
              - { label: "Dauer", name: "dauer", widget: "string", required: false }
              - { label: "Anzahl Einheiten", name: "einheiten", widget: "string", required: false }
              - { label: "Saison", name: "saison", widget: "string", required: false }
              - { label: "Startdatum", name: "startdatum", widget: "datetime", required: false }
              - { label: "Enddatum", name: "enddatum", widget: "datetime", required: false }
              - { label: "Preis", name: "preis", widget: "string", required: false }
              - { label: "Buchungslink", name: "buchungslink", widget: "string", required: false }
              - { label: "Kursfoto", name: "bild", widget: "image", required: false }

  - name: "termine"
    label: "Termine"
    files:
      - name: "termine"
        label: "Termine verwalten"
        file: "_data/termine.yml"
        fields:
          - label: "Kurstermine"
            name: "termine"
            widget: "list"
            summary: "{{fields.kurs}} – {{fields.datum}}"
            fields:
              - { label: "Kurs", name: "kurs", widget: "string" }
              - { label: "Datum", name: "datum", widget: "datetime" }
              - { label: "Beginn", name: "beginn", widget: "string", required: false }
              - { label: "Veranstaltungsort", name: "ort", widget: "string", required: false }
              - { label: "Buchbar", name: "buchbar", widget: "boolean", default: true }
              - { label: "Buchungslink", name: "buchungslink", widget: "string", required: false }

  - name: "yoga-fuer-dich"
    label: "Dein.Yog.A für Dich"
    files:
      - name: "yoga-fuer-dich"
        label: "Angebotsseite bearbeiten"
        file: "_data/yoga_fuer_dich.yml"
        fields:
          - { label: "Seitentitel", name: "seitentitel", widget: "string" }
          - label: "1. Erklärung Dein.Yog.A"
            name: "erklaerung"
            widget: "object"
            fields:
              - { label: "Kleine Überschrift", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Schlusssatz", name: "schlusssatz", widget: "string" }
              - { label: "Button-Text", name: "button_text", widget: "string" }
              - { label: "Button-Link", name: "button_link", widget: "string" }
          - label: "2. Journey"
            name: "journey"
            widget: "object"
            fields:
              - { label: "Zeitraum", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Einleitung", name: "einleitung", widget: "text" }
              - { label: "Bezeichnung Montag", name: "montag_label", widget: "string" }
              - { label: "Bezeichnung Donnerstag", name: "donnerstag_label", widget: "string" }
              - { label: "Uhrzeit", name: "zeit", widget: "string" }
              - label: "Wochenübersicht Montag / Donnerstag"
                name: "wochen"
                widget: "list"
                summary: "Woche {{index}}"
                fields:
                  - { label: "Montag", name: "montag", widget: "string", required: false }
                  - { label: "Donnerstag", name: "donnerstag", widget: "string", required: false }
              - { label: "Samstagsreise – Überschrift", name: "samstag_titel", widget: "string" }
              - { label: "Samstagsreise – Uhrzeit", name: "samstag_zeit", widget: "string" }
              - label: "Samstagstermine"
                name: "samstage"
                widget: "list"
                field: { label: "Termin", name: "datum", widget: "string" }
              - { label: "Hinweis Kleingruppen", name: "kleingruppen_hinweis", widget: "string" }
          - label: "3. Teilnahme- und Kostenmodelle"
            name: "modelle"
            widget: "object"
            fields:
              - { label: "Kleine Überschrift", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Einleitung", name: "einleitung", widget: "text" }
              - label: "Angebote"
                name: "angebote"
                widget: "list"
                summary: "{{fields.titel}} – {{fields.preis}}"
                fields:
                  - { label: "Titel", name: "titel", widget: "string" }
                  - { label: "Preis", name: "preis", widget: "string" }
                  - { label: "Umfang", name: "umfang", widget: "string" }
                  - { label: "Beschreibung", name: "beschreibung", widget: "text" }
                  - label: "Leistungen"
                    name: "leistungen"
                    widget: "list"
                    field: { label: "Leistung", name: "leistung", widget: "string" }
              - { label: "Hinweis Gruppengröße", name: "gruppenhinweis", widget: "string" }
          - label: "4. Early Bird"
            name: "early_bird"
            widget: "object"
            fields:
              - { label: "Kleine Überschrift", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Einleitung", name: "einleitung", widget: "text" }
              - { label: "Stichtag", name: "stichtag", widget: "string" }
              - label: "Frühbucherpreise"
                name: "angebote"
                widget: "list"
                summary: "{{fields.titel}}"
                fields:
                  - { label: "Angebot", name: "titel", widget: "string" }
                  - { label: "Normalpreis", name: "normalpreis", widget: "string" }
                  - { label: "Frühbucherpreis", name: "fruehbucherpreis", widget: "string" }
          - label: "5. Aufbau der Session"
            name: "session"
            widget: "object"
            fields:
              - { label: "Kleine Überschrift", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - label: "Session-Schritte"
                name: "schritte"
                widget: "list"
                fields:
                  - { label: "Titel", name: "titel", widget: "string" }
                  - { label: "Beschreibung", name: "text", widget: "text" }
              - { label: "Zielgruppe – Überschrift", name: "zielgruppe_titel", widget: "string" }
              - { label: "Zielgruppe – Text", name: "zielgruppe_text", widget: "text" }
              - { label: "Dauer", name: "dauer", widget: "string" }
          - label: "6. Alles, was du wissen solltest"
            name: "wissen"
            widget: "object"
            fields:
              - { label: "Kleine Überschrift", name: "eyebrow", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Vor der Einheit – Überschrift", name: "vorbereitung_titel", widget: "string" }
              - { label: "Vor der Einheit – Text", name: "vorbereitung_text", widget: "text" }
              - { label: "Gesundheit – Überschrift", name: "gesundheit_titel", widget: "string" }
              - { label: "Gesundheit – Text", name: "gesundheit_text", widget: "text" }

  - name: "seiten"
    label: "Weitere Seiten"
    files:
      - name: "ueber-andrea"
        label: "Über Andrea"
        file: "_data/ueber_andrea.yml"
        fields:
          - { label: "Seitentitel", name: "title", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - { label: "Porträtbild", name: "image", widget: "image", required: false }
          - { label: "Über mich", name: "body", widget: "text" }
          - { label: "Qualifikationen", name: "qualifications", widget: "list", field: { label: "Qualifikation", name: "qualification", widget: "string" } }
      - name: "retreat"
        label: "Dein.Yog.Art of Retreat"
        file: "_data/retreat.yml"
        fields:
          - { label: "Seitentitel", name: "title", widget: "string" }
          - { label: "Kleine Überschrift im Einstieg", name: "eyebrow", widget: "string" }
          - { label: "SEO-Beschreibung", name: "meta_description", widget: "text" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - { label: "Kleine Überschrift im Hauptbereich", name: "section_eyebrow", widget: "string" }
          - { label: "Überschrift im Hauptbereich", name: "section_title", widget: "string" }
          - { label: "Beschreibung des Retreats", name: "body", widget: "text" }
          - { label: "Kleine Überschrift im Kontaktbereich", name: "cta_eyebrow", widget: "string" }
          - { label: "Überschrift im Kontaktbereich", name: "cta_title", widget: "string" }
          - { label: "Kontakttext", name: "cta_text", widget: "text" }
          - { label: "Button-Beschriftung", name: "button_text", widget: "string" }
          - { label: "Button-Link", name: "button_link", widget: "string" }
      - name: "impressum"
        label: "Impressum"
        file: "_data/impressum.yml"
        fields:
          - { label: "Seitentitel", name: "title", widget: "string" }
          - { label: "SEO-Beschreibung", name: "meta_description", widget: "text" }
          - { label: "Kleine Überschrift", name: "eyebrow", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Marke / Auftritt", name: "brand", widget: "string" }
          - { label: "Straße und Hausnummer", name: "street", widget: "string" }
          - { label: "PLZ und Ort", name: "postal_city", widget: "string" }
          - { label: "Land", name: "country", widget: "string" }
          - { label: "Telefon (Anzeige)", name: "phone_display", widget: "string" }
          - { label: "Telefon (Link)", name: "phone_link", widget: "string" }
          - { label: "E-Mail", name: "email", widget: "string" }
          - { label: "Website", name: "website", widget: "string" }
          - { label: "Tätigkeitsbereich – Überschrift", name: "activity_heading", widget: "string" }
          - { label: "Tätigkeitsbereich – Text", name: "activity_text", widget: "text" }
          - { label: "Umsatzsteuer – Überschrift", name: "vat_heading", widget: "string" }
          - { label: "Umsatzsteuer – Text", name: "vat_text", widget: "text" }
          - { label: "Blattlinie – Überschrift", name: "editorial_heading", widget: "string" }
          - { label: "Blattlinie – Text", name: "editorial_text", widget: "text" }
