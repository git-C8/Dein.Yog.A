title: "Über Andrea"
meta_description: "Lerne Andrea kennen – Yogatrainerin und Neuromentaltrainerin. Erfahre mehr über ihren Weg, ihre Philosophie und Dein.Yog.A."
eyebrow: "Bewegung. Atem. Mentale Stärke."
hero_title: "Schön, dass du da bist!"
hero_subtitle: "Zeit für dich."
intro: "Ich bin Andrea – Yogatrainerin, Neuromentaltrainerin, Mama, Teamleiterin und Lebenspartnerin. Ein Mensch, der gerne bewegt, gestaltet, Neues ausprobiert und immer wieder voller Ideen steckt."
intro_quote: "Yoga ist für mich mehr als Bewegung – es ist eine bewusste Zeit für dich selbst."
image: "/images/andrea-portrait-placeholder.svg"
image_alt: "Platzhalter für ein Porträt von Andrea"
journey_eyebrow: "Mein Weg"
journey_title: "Viele Ideen. Viel Bewegung. Und immer wieder die Suche nach Balance."
journey_paragraphs:
  - "Mein beruflicher und persönlicher Weg ist geprägt von Kreativität, wirtschaftlichem Denken und einer großen Portion Leistungsorientierung. Nach meinem Studium an der Wirtschaftsuniversität Wien haben mich berufliche Herausforderungen, neue Projekte und die Freude daran, Dinge voranzubringen, stets begleitet. Mein Kopf ist voller Ideen, Gedanken und Pläne – Stillstand liegt mir nicht besonders."
  - "Bewegung begleitet mich schon mein ganzes Leben. Gleichzeitig habe ich früh entdeckt, wie wertvoll bewusste Atmung, Konzentration und mentale Techniken sind, um auch in einem aktiven Alltag die eigene Balance zu finden. Genau deshalb hat Yoga einen besonderen Platz in meinem Leben gefunden: als bewusster Gegenpol, um innezuhalten, Klarheit und Fokus zu finden und neue Energie zu schöpfen."
  - "Aus dieser persönlichen Erfahrung und meiner Begeisterung für Bewegung und mentale Stärke entstand der Wunsch, mich intensiver mit diesen Themen auseinanderzusetzen."
training_eyebrow: "Was mich begleitet"
training_title: "Lernen, wachsen und den eigenen Weg weiterentwickeln."
qualifications:
  - "2003 – Abschluss des Studiums der Sozial- und Wirtschaftswissenschaften an der Wirtschaftsuniversität Wien"
  - "2024 – Ausbildung zur Neuromentaltrainerin"
  - "2025 – Abschluss der Ausbildung zur Yogatrainerin"
  - "Aktuell – Ausbildung zur Meditationstrainerin"
origin_text: "Aus dieser Entwicklung und meiner Begeisterung heraus ist Dein.Yog.A entstanden."
philosophy_eyebrow: "Meine Philosophie"
philosophy_title: "Dein.Yog.A – Bewegung, Atmung und mentale Ausgeglichenheit."
philosophy_paragraphs:
  - "Für mich ist Yoga weit mehr als die Verbindung einzelner Körperübungen. Es ist das bewusste Zusammenspiel von Bewegung, Atmung und mentaler Ausgeglichenheit."
  - "In meinen Dein.Yog.A Einheiten verbinde ich fließende Vinyasa-Flows mit kräftigenden, stabilisierenden und mobilisierenden Übungen sowie gezielten Dehnungen. Dabei geht es darum, den eigenen Körper bewusster wahrzunehmen, Kraft und Beweglichkeit aufzubauen und gleichzeitig den Kopf freizubekommen."
  - "Meine Kenntnisse aus dem Neuromentaltraining fließen ergänzend in die Einheiten ein. Kleine mentale Impulse und bewusste Atemübungen unterstützen dich dabei, deinen Fokus auf dich selbst zu richten, neue Energie zu schöpfen und auch im Alltag mehr Achtsamkeit und innere Balance zu entwickeln."
  - "Jede Einheit ist eine Einladung, den Alltag für einen Moment hinter dir zu lassen. Wir verbinden Atem und Bewegung, finden unseren eigenen Flow und gleiten schließlich in ein wohltuendes Cool-down und eine entspannende Endentspannung mit Elementen der Meditation."
  - "Dabei ist mir besonders wichtig, eine angenehme und wertschätzende Atmosphäre zu schaffen, in der du ganz bei dir ankommen kannst. Ohne Leistungsdruck, ohne Vergleiche – dafür mit Freude an der Bewegung und einem guten Gefühl für deinen Körper."
yoga_eyebrow: "Dein Yoga. Dein Tempo. Dein Moment."
yoga_title: "Yoga, das zu dir passt."
yoga_paragraphs:
  - "Dein.Yog.A steht für Yoga, das zu dir passt – zu deinem Körper, deinen Bedürfnissen und deiner aktuellen Lebenssituation. Ob du Kraft aufbauen, deine Beweglichkeit verbessern, neue Energie tanken oder einfach zur Ruhe kommen möchtest: Jede Einheit schenkt dir die Möglichkeit, dich selbst wieder ein Stück bewusster wahrzunehmen."
  - "Die Natur ist dabei für mich ein besonderer Kraftort. Sie inspiriert mich, den Augenblick zu genießen und immer wieder neue Balance zu finden. Dieses Gefühl möchte ich auch in meinen Einheiten weitergeben."
closing_quote: "In der Bewegung Ruhe finden. Im Atem Kraft schöpfen. Bei dir selbst ankommen."
closing_text: "Ich freue mich darauf, dich bei Dein.Yog.A willkommen zu heißen und dich auf deiner ganz persönlichen Yoga-Reise ein Stück begleiten zu dürfen!"
signoff: "Namasté,"
signature: "Andrea"
