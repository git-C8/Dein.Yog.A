title: "Über Andrea"
intro: "Ich bin Andrea – und mit Dein.Yog.A möchte ich Dir Raum geben, bewusst durchzuatmen, Dich zu bewegen und Zeit für Dich zu nehmen. Ich freue mich darauf, Dich kennenzulernen und gemeinsam mit Dir zu praktizieren."
image: ""
body: "Hier erzähle ich Dir bald mehr über meinen persönlichen Weg zum Yoga, meine Motivation und meine Unterrichtsphilosophie."
