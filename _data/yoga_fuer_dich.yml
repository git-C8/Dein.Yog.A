seitentitel: "Deine Zeit für Bewegung und Entspannung."
einleitung: "Entdecke Dein.Yog.A in persönlicher Atmosphäre in Korneuburg. Mein Angebot verändert sich mit den Jahreszeiten – damit Du immer wieder neue Impulse für Deine Praxis findest."
saison_titel: "Dein.Yog.A – Herbst Journey"
saison_zeitraum: "Oktober bis Dezember 2026"
saison_beschreibung: "Nimm Dir Zeit, um anzukommen, durchzuatmen und neue Kraft zu schöpfen. Die saisonalen Einheiten begleiten Dich mit achtsamer Bewegung, stärkenden Übungen und wohltuender Entspannung."
kurs_titel: "Klassisch! Dein.Yog.A Flow"
kurs_beschreibung: "Zeit für Dich. Zeit zum Durchatmen. Zeit für Bewegung, Kräftigung und Entspannung. Harmonisch aufgebaute Einheiten verbinden bewusstes Ankommen, stärkende Asanas und fließende Bewegungen mit einem ruhigen Abschluss."
zielgruppe: "Für bewegliche Anfänger:innen und Fortgeschrittene."
dauer: "Ca. 75 Minuten"
ablauf_ankommen: "Atemübungen zur Entspannung, sanftes Warm-up, Stabilisation und Dehnung."
ablauf_flows: "Kräftigende und stabilisierende Körperübungen sowie kurze, intensivere Flows."
ablauf_entspannung: "Bewusstes Loslassen, Ruhe und Regeneration."
ankunft_hinweis: "Bitte komme etwa zehn Minuten vor Beginn."
mitbringen: "Bring Deine Yogamatte, eine Wasserflasche und – wenn vorhanden – Korkblöcke mit."
ort_hinweis: "Wir praktizieren im Dein.Yog.A Room oder am Teich, je nach Wetterlage. Adresse: Im Jägerfeld 10, 2100 Korneuburg."
storno_hinweis: "Eine Stornierung ist bis 24 Stunden vor Beginn kostenlos möglich."
teilnahme_hinweis: "Die Teilnahme erfolgt auf eigene Verantwortung."
