seitentitel: "Dein.Yog.A für Dich"
erklaerung:
  eyebrow: "Dein Yoga. Deine Ziele."
  titel: "Yoga ist so individuell wie du selbst."
  text: "Yoga ist so individuell wie du selbst. Bei Dein.Yog.A findest du sowohl saisonale Yoga Journeys mit fixen Terminen und einem abgestimmten Stundenkonzept als auch ganz persönliche Yoga-Erlebnisse, die sich nach deinen Wünschen und Zielen richten. Ob du alleine in einer Einzelstunde, gemeinsam mit Freunden oder in einer Gruppe von bis zu acht Personen praktizieren möchtest – wir gestalten deine ganz persönliche Yoga-Reise. Gemeinsam definieren wir deine Schwerpunkte und entwickeln daraus ein passendes Konzept für Körper, Atem und mentale Balance. Ab fünf Einheiten entsteht so deine individuelle Yoga Journey – ganz auf dich und deine Gruppe abgestimmt."
  schlusssatz: "Dein Yoga. Deine Ziele. Deine ganz persönliche Journey."
  button_text: "Hier anfragen"
  button_link: "kontakt.html"
