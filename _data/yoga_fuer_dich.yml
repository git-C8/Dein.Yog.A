session:
  eyebrow: "Dein Yoga in 75 Minuten"
  titel: "So ist deine Dein.Yog.A Session aufgebaut"
  schritte:
    - titel: "Ankommen & Durchatmen"
      text: "Wir starten mit bewusster Atmung, sanften Atemübungen und einer entspannten Einstimmung. Du lässt den Alltag hinter dir und kommst ganz bei dir an."
    - titel: "Bewegen & Kraft schöpfen"
      text: "Im Hauptteil verbinden wir mobilisierende und dehnende Asanas mit kräftigenden, fließenden Vinyasa-Flows. Wir fördern Beweglichkeit, Stabilität und Körperbewusstsein und bringen Körper und Atem in Einklang."
    - titel: "Loslassen & Entspannen"
      text: "Mit einem sanften Cool-down lassen wir die Bewegung ausklingen und gleiten in Shavasana – eine wohltuende Endentspannung, um zur Ruhe zu kommen und neue Energie zu tanken."
  zielgruppe_titel: "Für wen sind die Dein.Yog.A Sessions geeignet?"
  zielgruppe_text: "Meine Einheiten richten sich an bewegliche Anfängerinnen und alle, die Freude an abwechslungsreicher Bewegung haben und ihre Kraft, Beweglichkeit und innere Balance weiterentwickeln möchten."
  dauer: "Ca. 75 Minuten"
wissen:
  eyebrow: "Gut vorbereitet auf deine Praxis"
  titel: "Alles, was du wissen solltest"
  vorbereitung_titel: "Vor der Einheit"
  vorbereitung_text: "Komm gerne ca. 10 Minuten vor der Einheit im Raum auf deiner Matte an – bei ruhiger Entspannungsmusik. Blöcke und Gurte sind vorhanden. Deine Yogamatte bring bitte selbst mit."
  gesundheit_titel: "Achte auf dich"
  gesundheit_text: "Bei gesundheitlichen Vorbelastungen kläre die Teilnahme vorab mit deinem Arzt ab. Grundsätzlich gilt, dass du auf dich selbst achtest und du für dein eigenes Wohlbefinden verantwortlich bist."
