location_title: "Dein Platz zum Ankommen / Yoga in Korneuburg"
location_subtitle: "Dein.Yog.A – drinnen oder draußen, immer im Einklang mit der Natur"
location_paragraphs:
  - "In den kalten und grauen Monaten praktizieren wir in meinem Dein.Yog.A Room – einem wohlig warmen, lichtdurchfluteten Raum, der zum Ankommen, Durchatmen und Wohlfühlen einlädt."
  - "Sobald die Sonne wieder lacht und die Temperaturen es zulassen, verlegen wir unsere Yoga-Einheiten nach draußen. Am Teich genießen wir die Ruhe, die frische Luft und die besondere Energie der Natur. Ob drinnen oder draußen – wir praktizieren dort, wo wir uns wohlfühlen. Die Entscheidung richtet sich ganz nach der Wetterlage."
