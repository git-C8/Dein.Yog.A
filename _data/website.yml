journey_title: "Dein.Yog.A – Winter.Journey 27"
journey_period: "Jänner bis März 2027"
journey_intro: "Nimm Dir Zeit, um anzukommen, durchzuatmen und deinem Körper und Geist etwas Gutes zu tun."
journey_description:
  - "Die saisonalen Einheiten begleiten Dich mit achtsamer Bewegung, stärkenden Flows und wohltuender Entspannung durch den Winter."
  - "In der Winterjourney finden bis zu 25 Termine statt."
  - "Wähle das für Dich passende Modell, um nachhaltig und in aller Ruhe an Deinen Neujahresvorsätzen zu arbeiten."
