hero_title: "YOGA & ACHTSAMKEIT IN KORNEUBURG"
hero_subtitle: "Dein Raum zum Ankommen, Kräftigen und Entspannen."
hero_image: "/images/uploads/header-picture.png"
intro_title: "Schön, dass du da bist!"
intro_subtitle: "Dein.Yog.A – Yoga, das bewegt."
intro_paragraphs:
  - "Achtsame Bewegung, bewusste Atmung und fließende, kräftigende Vinyasa-Flows verbinden Körper und Geist. In rund 75 Minuten schaffst du Raum für dich, stärkst deinen Körper, verbesserst deine Beweglichkeit und findest deine Balance."
  - "Entdecke deine Möglichkeiten, setze neue Impulse und wage wenn du möchtest über deine gewohnten Grenzen hinaus – immer im eigenen Tempo und so, wie es sich für dich richtig anfühlt."
  - "Entdecke Dein.Yog.A in persönlicher Atmosphäre in Korneuburg."
  - "Mein Yoga-Angebot orientiert sich an den Jahreszeiten und bringt regelmäßig neue Schwerpunkte und Inspirationen für deine persönliche Praxis."
  - "Ob regelmäßiger Kurs, abwechslungsreiche All-in-Jahreszeiten-Journey oder flexibler 10er-Block – finde das Angebot, das zu deinem Alltag und deinen Bedürfnissen passt."
intro_closing: "Dein.Yog.A – deine Zeit. Deine Bewegung. Dein Yoga mit Andrea."
